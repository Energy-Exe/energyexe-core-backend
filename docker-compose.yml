# Local stack: Postgres + Valkey + the API (development image target, port 8001).
#
# Most day-to-day development runs the API directly with Poetry on port 8002
# (see README.md, "Port"); this file is the self-contained alternative.
#   docker compose up -d
#   docker compose exec api alembic upgrade head
#   curl http://localhost:8001/health

services:
  api:
    build:
      context: .
      target: development
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/energyexe_db
      - REDIS_URL=redis://valkey:6379
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - energyexe-network

  postgres:
    image: postgres:15-alpine
    container_name: energyexe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energyexe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energyexe-network

  valkey:
    image: valkey/valkey:7-alpine
    container_name: energyexe-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energyexe-network

volumes:
  postgres_data:
  valkey_data:

networks:
  energyexe-network:
    driver: bridge
