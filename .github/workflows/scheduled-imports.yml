name: Manual Data Import

# NOT a schedule. Every import is scheduled by EventBridge in AWS —
# see infra/scheduled_imports.tf (`local.import_schedules`). This workflow is
# the manual escape hatch: re-running a job by hand, or driving a short backfill
# with the start/end overrides.
#
# GitHub `schedule:` was retired here on 2026-08-17. It is best-effort and was
# measurably unreliable for this repo: the hourly Taipower trigger fired on only
# 9-20 of 24 hours per day (15-60% dropped), and every daily import landed
# 21-80 minutes late. Do not add a `schedule:` block back — put it in Terraform.

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: 'Job to trigger'
        required: true
        type: choice
        options:
          - entsoe-daily
          - taipower-hourly
          - elexon-daily
          - entsoe-prices-daily
          - elexon-prices-daily
          - eia-monthly
          - ecb-rates-daily
      start:
        description: 'Override window start (YYYY-MM-DD, optional)'
        required: false
        type: string
      end:
        description: 'Override window end (YYYY-MM-DD, inclusive, optional)'
        required: false
        type: string

env:
  API_URL: https://api.energyexe.com

jobs:
  trigger:
    name: Trigger ${{ github.event.inputs.job_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger import
        run: |
          url="${{ env.API_URL }}/api/v1/import-jobs/trigger/${{ github.event.inputs.job_name }}"
          query=""
          [ -n "${{ github.event.inputs.start }}" ] && query="?start=${{ github.event.inputs.start }}"
          if [ -n "${{ github.event.inputs.end }}" ]; then
            [ -n "$query" ] && query="$query&end=${{ github.event.inputs.end }}" \
                            || query="?end=${{ github.event.inputs.end }}"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST "${url}${query}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          # A 504 here is the known ALB-idle-timeout false alarm: the import
          # keeps running server-side and updates its own job row. Check
          # /import-jobs before assuming it failed, and never blindly retry —
          # the backend runs a single worker and a retry stacks a second
          # blocking subprocess on it.
          if [ "$http_code" -ne 200 ]; then
            echo "❌ Trigger returned $http_code"
            exit 1
          fi

          # The endpoint returns 200 with the job row even when the import
          # itself failed, so the status field is the real signal.
          if echo "$body" | grep -q '"status":"failed"'; then
            echo "❌ Job reported failed"
            exit 1
          fi

          echo "✅ ${{ github.event.inputs.job_name }} completed"
